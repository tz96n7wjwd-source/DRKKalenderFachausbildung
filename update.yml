name: Termine aktualisieren
on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:          # manueller Start per Button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scrape.py
        env:
          KURS_URL: ${{ secrets.KURS_URL }}
      - name: Aenderungen speichern
        run: |
          git config user.name "kurskalender-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kurse.json
          git diff --cached --quiet || (git commit -m "Termine aktualisiert" && git push)
